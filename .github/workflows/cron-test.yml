# TEMPORARY: measures how late GitHub starts scheduled jobs. Posts nothing. Remove after the test.
name: Cron timing test

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: When did this start?
        run: |
          echo "Scheduled: ${{ github.event.schedule }}"
          echo "Started:   $(date -u +%FT%TZ)  ($(TZ=Asia/Kolkata date '+%H:%M:%S IST'))"
