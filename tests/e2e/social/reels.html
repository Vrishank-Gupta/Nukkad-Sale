<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NukkadSale reels</title>
<!--
  Vertical reels (9:16). reels.html#1 … #10 picks the reel (10 is the ~30 s promo). Every animation is a CSS animation on one
  clock; render.mjs pauses them and seeks frame by frame. Phone screens are real app screenshots;
  chat screens are re-created from the bot's real messages (labelled in the image itself).
-->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:720px;height:1280px;overflow:hidden;font-family:system-ui,"Noto Sans","Noto Sans Devanagari",sans-serif;background:#14120f;color:#fff}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
@keyframes vis{from,to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(120px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes out{from{opacity:1}to{opacity:0}}
@keyframes slam{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes strike{from{width:0}to{width:104%}}
@keyframes tap{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(var(--zs,1.6))}}
@keyframes pan{from{transform:translateY(0)}to{transform:translateY(var(--py,-200px))}}
@keyframes flyL{from{opacity:0;transform:translateX(-500px) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes flyR{from{opacity:0;transform:translateX(500px) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes bar{from{transform:rotate(var(--r,0deg)) scaleX(0)}to{transform:rotate(var(--r,0deg)) scaleX(1)}}
@keyframes count{from{--n:0}to{--n:1}}
/* hit: on screen from frame 0, then settles – used for every hook so the first frame is never empty */
@keyframes hit{0%{opacity:1;transform:scale(1.22)}55%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(3)}60%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
[data-a]{opacity:0}

.c{position:absolute;left:0;right:0;text-align:center;padding:0 40px}
.h{font-size:84px;font-weight:900;line-height:1.02;letter-spacing:-1.5px;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.m{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.s{font-size:34px;font-weight:600;line-height:1.25;opacity:.92}
.y{color:#ffd43b}.o{color:#ff8a3d}.g{color:#69db7c}
.pill{display:inline-block;padding:12px 26px;border-radius:99px;font-weight:800;font-size:30px}
.dark{background:radial-gradient(circle at 50% 30%,#2a2620,#0e0d0b)}
.orange{background:linear-gradient(160deg,#f76707,#d9480f 60%,#a83a0c)}
.cream{background:radial-gradient(circle at 20% 15%,#fff1e8,#faf7f2 55%,#f3e7d8);color:#1d1a16}
.green{background:linear-gradient(170deg,#1f7a4a,#0f4d2e)}
.phone{position:absolute;left:50%;width:400px;height:866px;margin-left:-200px;border-radius:52px;background:#1d1a16;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.phone .scr{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:#fff}
.phone .scr img{width:100%;display:block;transform-origin:var(--ox,50%) var(--oy,50%)}
.ripple{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(217,72,15,.35);border:4px solid rgba(217,72,15,.9)}
.cap{position:absolute;left:40px;right:40px;text-align:center}
.tag{display:inline-block;background:#1d1a16;color:#fff;font-weight:800;font-size:34px;padding:14px 26px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tag.o{background:#d9480f;color:#fff}
.note{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:18px;opacity:.55}
/* UPI credit notification cards */
.notif{position:absolute;left:60px;right:60px;height:96px;background:#fff;color:#1d1a16;border-radius:22px;display:flex;align-items:center;gap:18px;padding:0 22px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.notif i{font-style:normal;width:56px;height:56px;border-radius:16px;background:#e6f4ea;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.notif b{font-size:30px}.notif small{display:block;font-size:22px;color:#6b6258}
.notif .amt{margin-left:auto;font-size:34px;font-weight:900;color:#2b8a3e}
.notif .who{margin-left:auto;font-size:26px;font-weight:800;color:#d9480f;text-align:right}
.bub{position:absolute;background:#fff;color:#1d1a16;font-size:40px;font-weight:800;padding:18px 28px;border-radius:30px 30px 30px 8px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.bub small{display:block;font-size:22px;color:#2b8a3e;font-weight:800}
.logo{font-size:76px;font-weight:900;letter-spacing:-1px}
.book{position:absolute;left:90px;right:90px;top:300px;height:640px;background:#fffbe9;border-radius:18px;color:#3b3226;padding:46px 40px 0 90px;box-shadow:0 30px 70px rgba(0,0,0,.5);background-image:repeating-linear-gradient(#fffbe9 0 62px,#c9d8ef 62px 64px);transform:rotate(-3deg)}
.book:before{content:"";position:absolute;left:62px;top:0;bottom:0;width:3px;background:#e8a0a0}
.book p{font-family:"Comic Sans MS","Noto Sans Devanagari",cursive;font-size:36px;line-height:64px;white-space:nowrap}
.x{position:absolute;height:8px;background:#e03131;border-radius:4px;transform-origin:left}
.post{position:absolute;left:150px;right:150px;top:260px;background:#fff;color:#1d1a16;border-radius:24px;padding:16px;font-size:26px;line-height:1.35;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.post small{display:block;color:#d9480f;font-weight:800;font-size:20px;margin-bottom:8px}
.post img{width:100%;border-radius:14px;display:block;margin-bottom:12px}
.badge{position:absolute;right:30px;top:30px;background:#e03131;color:#fff;font-weight:900;font-size:36px;padding:10px 24px;border-radius:99px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.veil{position:absolute;inset:0;background:rgba(10,9,8,.82);z-index:4}
.scene .h{position:absolute;z-index:6}
.pain{position:absolute;left:50px;right:50px;display:flex;gap:22px;align-items:center;font-size:40px;font-weight:800;line-height:1.15}
.pain i{font-style:normal;flex:none;width:74px;height:74px;border-radius:50%;background:#e03131;display:flex;align-items:center;justify-content:center;font-size:40px}
.step{display:flex;gap:20px;align-items:center;font-size:40px;font-weight:800;text-align:left}
.shot{position:absolute;left:130px;right:130px;top:330px;background:#fff;color:#1d1a16;border-radius:30px;padding:46px 34px 40px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.shot .ok{width:120px;height:120px;border-radius:50%;background:#2b8a3e;color:#fff;font-size:76px;line-height:120px;margin:0 auto 22px;font-weight:900}
.shot b{display:block;font-size:76px;font-weight:900;letter-spacing:-2px}
.shot small{display:block;font-size:26px;color:#6b6258;margin-top:10px;line-height:1.4}
.fake{position:absolute;left:150px;top:520px;border:12px solid #e03131;color:#e03131;font-size:120px;font-weight:900;padding:4px 30px;border-radius:22px;letter-spacing:4px;background:rgba(255,255,255,.88);z-index:5}
.me{position:absolute;right:50px;background:#d9fdd3;color:#1d1a16;font-size:38px;font-weight:700;padding:18px 26px;border-radius:30px 30px 8px 30px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.me small{display:block;font-size:22px;color:#6b6258;font-weight:700}
.me u{display:block;text-decoration:none;text-align:right;font-size:22px;color:#53bdeb}
.q{font-size:220px;font-weight:900;letter-spacing:-6px;line-height:1}
.white{background:#fbfaf8;color:#14120f}
.split{position:absolute;top:300px;bottom:150px;width:50%;padding:0 18px}
.split.l{left:0;border-right:3px dashed #e6dfd2}.split.r{right:0}
.split .hd{font-size:26px;font-weight:900;letter-spacing:1px;text-transform:uppercase;text-align:center;margin-bottom:18px}
.mini{background:#fff;border:2px solid #ece5da;border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.mini .mq{color:#d9480f}.mini .mp{color:#2b8a3e}
.ctr{font-size:200px;font-weight:900;letter-spacing:-8px;line-height:1;color:#2b8a3e}
.ul{text-decoration:underline;text-decoration-color:#d9480f;text-decoration-thickness:10px;text-underline-offset:10px}
.step i{font-style:normal;flex:none;width:70px;height:70px;border-radius:50%;background:#d9480f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const EASE = 'cubic-bezier(.2,.9,.3,1.2)'
const phone = (img, top, extra = '', o = {}) => `<div class="phone" style="top:${top}px;${o.style || ''}" ${o.a ? `data-a="${o.a}" data-t="${o.t ?? 0}" data-d="${o.d ?? .6}"` : ''}><div class="scr">
  <img src="img/${img}.png" style="${o.img || ''}" ${o.zoom ? `data-a="zoom" data-t="${o.zoom[0]}" data-d="${o.zoom[1]}" data-e="ease-in-out"` : ''}>${extra}</div></div>`
const tapAt = (x, y, t) => `<div class="ripple" style="left:${x}%;top:${y}%" data-a="tap" data-t="${t}" data-d=".8" data-e="ease-out"></div>`
const SHOP = (w, c = 'currentColor') => `<svg class="shop" viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 3h13.6L21 9a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z" fill="${c}" stroke-width="1.4"/><path d="M5 12.6V21h14v-8.4M10 21v-5h4v5"/></svg>`
const end = (line, sub = 'Link in bio · nukkadsale.in') => ({ d: 2.6, cls: 'orange', html: `
  <div class="c" style="top:420px" data-a="slam" data-d=".6"><div class="logo"><span style="display:inline-flex;align-items:center;gap:.22em">${SHOP('.9em')}NukkadSale</span></div></div>
  <div class="c m" style="top:560px" data-a="pop" data-t=".35">${line}</div>
  <div class="c" style="top:760px" data-a="pop" data-t=".7"><span class="pill" style="background:#fff;color:#d9480f">${sub}</span></div>` })

const DMS = [['Priya', 'Price?', 40, 120], ['Sana', 'M size hai??', 330, 210], ['Ritu', 'Kitne ka hai', 70, 330], ['Neha', 'Mera hold karo pls', 300, 430],
  ['Kavya', 'L available?', 30, 540], ['Anjali', 'Payment kaise karu?', 270, 650], ['Pooja', 'COD hai?', 60, 760], ['Simran', 'Still available??', 300, 860],
  ['Divya', 'Photo bhejo', 40, 970], ['Meghna', 'Hello??', 380, 1060], ['Riya', 'Mine!!', 380, 140], ['Tanvi', 'Same in blue?', 40, 1110],
  ['Isha', 'Bhej diye ₹799 ✓', 330, 330], ['Nisha', 'Kab tak milega?', 50, 440], ['Aarti', 'Reply karo!!', 360, 760], ['Komal', 'Size chart?', 330, 980]]
const PAINS = ['Typing “₹799, S M L” 50 times', 'Who asked first? 🤷‍♀️', 'Last piece promised to 3 people', 'Scrolling for payment screenshots']
const REELS = {
// Every reel: the hook is on screen at frame 0 ("hit"), a second beat lands by ~1.2 s, the product shows by ~3 s.
// Only features that are live today: website order link, exact-amount UPI, stock hold, khata, Hindi.

1: { title: 'paise', scenes: [

  { d: 3.0, cls: 'dark', html: `

    ${[0,1,2,3,4,5].map(i => `<div class="notif" style="top:${330 + i * 112}px" data-a="${i % 2 ? 'flyR' : 'flyL'}" data-t="${.2 + i * .18}" data-d=".4"><i>₹</i><div><b>Received</b><small>UPI · just now</small></div><div class="amt">₹799.00</div></div>`).join('')}

    ${[['798.12','Priya'],['798.47','Sana'],['798.80','Kavya'],['798.33','Anjali'],['798.65','Ritu']].map(([a, n], i) => `<div class="notif" style="top:${350 + i * 118}px" data-a="pop" data-t="${.3 + i * .25}" data-d=".4"><i>₹</i><div><b>₹${a}</b><small>UPI · just now</small></div><div class="who">= ${n}'s<br>order ✓</div></div>`).join('')}` },
  { d: 3.6, cls: 'cream', html: `
    <div class="cap" style="top:60px" data-a="pop"><span class="tag">Did that amount arrive?</span></div>

  { ...end('No screenshots.<br>No guessing.') },

window.DURATION = t

window.CUTS = R.scenes.map((s) => s.t)
window.CUES = { ding: R.ding, impact: R.impact, pops: R.pops }
window.seek = (sec) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = sec * 1000 } }
window.seek(0)
</script>
